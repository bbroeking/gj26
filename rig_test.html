<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rig test — walk + sockets</title>
<style>
  html,body{margin:0;height:100%;background:#2b3033;overflow:hidden;font:13px/1.4 -apple-system,sans-serif;color:#ddd}
  #hud{position:fixed;left:12px;bottom:12px;font-family:monospace;font-size:12px;background:rgba(0,0,0,.45);color:#9fb;padding:6px 10px;border-radius:4px;white-space:pre}
  #help{position:fixed;left:12px;top:12px;background:rgba(0,0,0,.45);padding:8px 12px;border-radius:4px;user-select:none}
  .k{display:inline-block;padding:1px 5px;margin:0 1px;border-radius:3px;background:rgba(255,255,255,.14);color:#fff;font-family:monospace}
  label{margin-right:10px}
</style>
<script type="importmap">
{ "imports": {
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="help">
  <b>Rig test — walk + sockets (B-approach: attach points authored in Blender)</b><br>
  <span class="k">W</span><span class="k">A</span><span class="k">S</span><span class="k">D</span>/<span class="k">↑</span><span class="k">←</span><span class="k">↓</span><span class="k">→</span> — walk · <span class="k">Shift</span> — run · mouse-drag — orbit · scroll — zoom<br>
  <span class="k">X</span> — draw &amp; fire the bow &nbsp;·&nbsp; <span class="k">P</span> — tune the sockets (drag gizmo) · in there: <span class="k">Tab</span> next socket · <span class="k">R</span> move/rotate<br>
  <div style="margin-top:6px">
    <label><input type="checkbox" id="cbWalk"> always walk (in place)</label>
    <label><input type="checkbox" id="cbQuiver" checked> quiver</label>
    <label><input type="checkbox" id="cbBow" checked> bow</label>
  </div>
</div>
<div id="hud">loading…</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { sfx } from './src/core/sfx.js';
addEventListener('keydown',   () => sfx.resume(), { once:true });
addEventListener('pointerdown', () => sfx.resume(), { once:true });

const BODY_URL  = 'models/ranger_sockets_v1.glb';     // Meshy auto-rig + Walking/Running + socket empties (placed in Blender)
const PROP_URLS = { quiver:'models/prop_quiver_v1.glb', bow:'models/prop_bow_v1.glb', arrow:'models/prop_arrow_v1.glb' };
const PROP_SIZE = { quiver:0.42, bow:0.95, arrow:0.7 };   // longest-axis target size (m)
// socket names baked into the body GLB
const SOCKETS = ['socket_back','socket_quiver','socket_hand_L','socket_hand_R'];

// ── scene ──
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b3033);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0, 1.0, 0);
controls.minDistance = 1; controls.maxDistance = 12; controls.maxPolarAngle = Math.PI*0.49;
controls.enabled = false;        // off in normal mode (TPS follow cam drives it); on while tuning sockets
const CAM_HEAD_Y = 1.3;
let camDist = 4.3, camAngle = 24 * Math.PI/180;       // behind-the-shoulder TPS; ↑ for a steeper look
camera.position.set(0, CAM_HEAD_Y + camDist*Math.sin(camAngle), camDist*Math.cos(camAngle));
camera.lookAt(0, CAM_HEAD_Y, 0);
addEventListener('wheel', e => { if (tune.on) return; camDist = Math.max(2.5, Math.min(11, camDist + Math.sign(e.deltaY)*0.45)); }, { passive:true });
scene.add(new THREE.HemisphereLight(0xbcd0e8, 0x3a3f33, 0.7));
const key = new THREE.DirectionalLight(0xfff2e0, 1.0);
key.position.set(4,7,5); key.castShadow = true; key.shadow.mapSize.set(2048,2048);
const sc = key.shadow.camera; sc.left=-6;sc.right=6;sc.top=6;sc.bottom=-6;sc.near=.5;sc.far=30;
scene.add(key, key.target);
const ground = new THREE.Mesh(new THREE.CircleGeometry(30,64), new THREE.MeshStandardMaterial({color:0x55663f, roughness:1}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(30,30,0x6b7d52,0x47512f); grid.position.y = 0.01; scene.add(grid);

// ── prop factory: clone a GLB, normalize its size, recentre its bbox at origin ──
const PROP_GLB = {};
const _box = new THREE.Box3(), _ctr = new THREE.Vector3();
function makeProp(kind) {
  const src = PROP_GLB[kind]; if (!src) return null;
  const g = new THREE.Group();
  const inst = src.clone(true);
  inst.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = false; } });
  inst.updateMatrixWorld(true);
  _box.setFromObject(inst);
  const span = Math.max(_box.max.x-_box.min.x, _box.max.y-_box.min.y, _box.max.z-_box.min.z) || 1;
  inst.scale.setScalar(span > 0.001 ? (PROP_SIZE[kind] || 0.5) / span : 1);
  inst.updateMatrixWorld(true);
  _box.setFromObject(inst); _box.getCenter(_ctr); inst.position.sub(_ctr);
  g.add(inst);
  return g;
}

// ── character ──
const hud = document.getElementById('hud');
const rig = new THREE.Group(); scene.add(rig);          // translated by movement
const yawPivot = new THREE.Group(); rig.add(yawPivot);  // facing-yaw only (model goes inside, never composed with the turn)
let model = null, mixer = null, actWalk = null, actRun = null;
const sockets = {}, props = {};
const move = { speed:0, facing:0 };
const $ = id => document.getElementById(id);

// equip = parent the prop wrapper straight onto a socket. No offsets, no scale
// math — the socket was positioned (incl. rotation) in Blender, so attaching is
// just `socket.add(wrap)`. wrap.scale stays 1; it inherits the socket's world
// scale (~1×); the prop's own size was set inside makeProp.
function equip(propWrap, socketName) {
  const s = sockets[socketName]; if (!s || !propWrap) return;
  s.add(propWrap);
  propWrap.position.set(0,0,0); propWrap.rotation.set(0,0,0); propWrap.scale.set(1,1,1);
}
function attachOrDetach() {
  const want = { quiver: $('cbQuiver').checked, bow: $('cbBow').checked };
  if (want.quiver && !props.quiver){ props.quiver = makeProp('quiver'); equip(props.quiver, 'socket_quiver'); }
  if (!want.quiver && props.quiver){ props.quiver.parent?.remove(props.quiver); props.quiver = null; }
  if (want.bow && !props.bow)      { props.bow = makeProp('bow'); equip(props.bow, 'socket_back'); }
  if (!want.bow && props.bow)      { props.bow.parent?.remove(props.bow); props.bow = null; }
}
['cbQuiver','cbBow'].forEach(id => $(id).addEventListener('change', attachOrDetach));

// ── socket-tuning mode (P): a TransformControls gizmo on the selected socket ──
// Drag it → the HUD prints the socket's world transform (for re-baking in Blender,
// or just to see where it is). The bow re-parents onto socket_hand_L while you
// tune that one so you can see it; ditto a temp arrow on socket_hand_R.
const tune = { on:false, idx:0, tc:null, markers:[], tempArrow:null };
function clearTemp(){ if (tune.tempArrow){ tune.tempArrow.parent?.remove(tune.tempArrow); tune.tempArrow=null; } }
function ensureGizmo() {
  if (tune.tc) return tune.tc;
  const tc = new TransformControls(camera, renderer.domElement);
  tc.setSize(0.85);
  tc.addEventListener('dragging-changed', e => { controls.enabled = !e.value; });
  scene.add(tc); tune.tc = tc;
  const geo = new THREE.SphereGeometry(0.035,10,8);
  const cols = { socket_back:0xff5577, socket_quiver:0xffbb33, socket_hand_L:0x55ff88, socket_hand_R:0xff7733 };
  for (const sn of SOCKETS) { const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color:cols[sn]||0xffffff, depthTest:false})); m.renderOrder=999; m.visible=false; scene.add(m); tune.markers.push({mesh:m,socket:sn}); }
  return tc;
}
function tuneSelect(idx) {
  tune.idx = ((idx % SOCKETS.length) + SOCKETS.length) % SOCKETS.length;
  const sn = SOCKETS[tune.idx];
  clearTemp();
  // park the bow / a temp arrow on the hand sockets so you can see what you're placing
  if (sn === 'socket_hand_L' && props.bow) equip(props.bow, 'socket_hand_L');
  else if (sn === 'socket_back' && props.bow) equip(props.bow, 'socket_back');
  else if (sn === 'socket_hand_R') { tune.tempArrow = makeProp('arrow'); equip(tune.tempArrow, 'socket_hand_R'); }
  const s = sockets[sn];
  if (s && tune.tc) tune.tc.attach(s); else tune.tc?.detach();
}
function toggleTune() {
  ensureGizmo();
  tune.on = !tune.on;
  for (const mk of tune.markers) mk.mesh.visible = tune.on;
  if (tune.on) { controls.enabled = true; tuneSelect(tune.idx); }
  else { controls.enabled = false; tune.tc.detach(); clearTemp(); if (props.bow) equip(props.bow,'socket_back'); }
}
function tuneReadout() {
  if (!tune.on) return '';
  const sn = SOCKETS[tune.idx];
  const s = sockets[sn]; if (!s) return `\n[tuning] ${sn}: not found`;
  s.updateWorldMatrix(true,false);
  const p = s.matrixWorld.elements;
  const e = new THREE.Euler().setFromRotationMatrix(s.matrixWorld);
  const f = v => +v.toFixed(3);
  return `\n[tuning socket: ${sn}]  Tab=next · R=${tune.tc.mode}\n  world pos:[${f(p[12])}, ${f(p[13])}, ${f(p[14])}]  rot:[${f(e.x)}, ${f(e.y)}, ${f(e.z)}]`;
}

// ── load props first (so attach sees them), then the body ──
Promise.all([
  ...Object.entries(PROP_URLS).map(([k,u]) => new Promise(res => new GLTFLoader().load(u,
    g => { PROP_GLB[k] = g.scene; res(); }, undefined, () => { PROP_GLB[k] = null; res(); }))),
  new Promise(res => new GLTFLoader().load(BODY_URL, g => res(g), undefined, e => { hud.textContent = 'BODY FAILED: ' + e.message; res(null); })),
]).then(results => {
  const gltf = results[results.length - 1]; if (!gltf) return;
  model = gltf.scene;
  model.traverse(o => { if (o.isMesh||o.isSkinnedMesh){ o.castShadow=true; o.receiveShadow=false; o.frustumCulled=false; } });
  model.updateMatrixWorld(true);
  let bb = new THREE.Box3().setFromObject(model);
  const h = (bb.max.y-bb.min.y) || 1;
  model.scale.setScalar(h>0.01 ? 1.7/h : 1);
  model.updateMatrixWorld(true);
  bb = new THREE.Box3().setFromObject(model);
  model.position.y -= bb.min.y;
  yawPivot.add(model);
  for (const sn of SOCKETS) { const o = model.getObjectByName(sn); if (o) sockets[sn] = o; }
  mixer = new THREE.AnimationMixer(model);
  const byName = {}; for (const c of gltf.animations) byName[c.name.toLowerCase()] = c;
  const pick = (...ks) => { for (const k of ks) for (const n in byName) if (n.includes(k)) return byName[n]; return gltf.animations[0]; };
  actWalk = mixer.clipAction(pick('walk')); actRun = mixer.clipAction(pick('run'));
  actWalk.play(); actWalk.setEffectiveWeight(0); actRun.play(); actRun.setEffectiveWeight(0);
  attachOrDetach();
  hud.dataset.clips = gltf.animations.map(c=>c.name).join(', ');
  hud.dataset.sockets = Object.keys(sockets).join(', ') || 'NONE in GLB';
  window.__rig = { scene, rig, yawPivot, model, mixer, sockets, props };
});

// ── input ──
const keys = {};
const TRACK = new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight','KeyX','KeyP','Tab','KeyR']);
addEventListener('keydown', e=>{
  if(!TRACK.has(e.code)) return;
  if (e.code==='KeyX' && !keys.KeyX) bow.fireQueued = true;
  if (e.code==='KeyP' && !keys.KeyP) toggleTune();
  if (tune.on && e.code==='Tab' && !keys.Tab) tuneSelect(tune.idx + 1);
  if (tune.on && e.code==='KeyR' && !keys.KeyR && tune.tc) tune.tc.setMode(tune.tc.mode === 'translate' ? 'rotate' : 'translate');
  keys[e.code]=true; e.preventDefault();
});
addEventListener('keyup',   e=>{ if(TRACK.has(e.code)){ keys[e.code]=false; e.preventDefault(); } });
addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

// ── bow draw → fire (placeholder draw — body clip slots in at DRAW when available) ──
const DRAW_T=0.45, NOCK_AT=0.15, AIM_T=0.18, RELEASE_T=0.18;
const bow = { state:'STOW', t:0, fireQueued:false, arrow:null };
const projectiles = [];
const _aimDir = new THREE.Vector3(), _aimOrigin = new THREE.Vector3(), _UP = new THREE.Vector3(0,1,0);
function updateBow(dt) {
  if (!props.bow || !sockets.socket_back || !sockets.socket_hand_L) { bow.state='STOW'; bow.fireQueued=false; return; }
  if (bow.fireQueued) { bow.fireQueued=false; if (bow.state==='STOW'){ bow.state='DRAW'; bow.t=0; equip(props.bow,'socket_hand_L'); sfx.bowDraw(); } }
  switch (bow.state) {
    case 'DRAW':
      bow.t += dt;
      if (!bow.arrow && bow.t >= NOCK_AT && sockets.socket_hand_R) { bow.arrow = makeProp('arrow'); equip(bow.arrow,'socket_hand_R'); }
      if (bow.t >= DRAW_T) { bow.state='AIM'; bow.t=0; }
      break;
    case 'AIM':
      bow.t += dt;
      if (bow.t >= AIM_T) {
        // fire along the camera's forward (TPS aim), with a slight upward arc
        camera.getWorldDirection(_aimDir); _aimDir.y += 0.10; _aimDir.normalize();
        if (bow.arrow) { bow.arrow.getWorldPosition(_aimOrigin); bow.arrow.parent?.remove(bow.arrow); }
        else { _aimOrigin.set(rig.position.x, 1.0, rig.position.z); }
        const proj = makeProp('arrow') || new THREE.Group();
        proj.position.copy(_aimOrigin);
        proj.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0), _aimDir.clone());   // arrow GLB lies along +X
        scene.add(proj);
        projectiles.push({ mesh:proj, vel:_aimDir.clone().multiplyScalar(20), life:2.5, landed:false });
        bow.arrow = null;
        bow.state='RELEASE'; bow.t=0;
        sfx.bowRelease(); sfx.arrowWhoosh();
      }
      break;
    case 'RELEASE':
      bow.t += dt;
      if (bow.t >= RELEASE_T) { equip(props.bow,'socket_back'); bow.state='STOW'; }
      break;
  }
}
function updateProjectiles(dt) {
  for (const p of projectiles) {
    p.life -= dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    p.vel.y -= 9.8 * dt * 0.5;
    if (p.vel.lengthSq() > 1e-4) p.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0), p.vel.clone().normalize());
    if (!p.landed && p.mesh.position.y < 0.02) { p.landed=true; p.life=Math.min(p.life,0.4); sfx.arrowHit(); }
  }
  for (let i=projectiles.length-1;i>=0;i--) if (projectiles[i].life<=0){ scene.remove(projectiles[i].mesh); projectiles.splice(i,1); }
}

// ── loop ──
const WALK=1.8, RUN=4.0, ACCEL=14, TURN=10;
const _f=new THREE.Vector3(), _r=new THREE.Vector3(), _w=new THREE.Vector3(), _co=new THREE.Vector3(), _tg=new THREE.Vector3();
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(0.05, clock.getDelta());
  camera.getWorldDirection(_f); _f.y=0; _f.normalize();
  _r.set(-_f.z, 0, _f.x);                  // camera-right = forward × up
  _w.set(0,0,0);
  if (keys.KeyW||keys.ArrowUp)_w.add(_f); if(keys.KeyS||keys.ArrowDown)_w.sub(_f);
  if (keys.KeyD||keys.ArrowRight)_w.add(_r); if(keys.KeyA||keys.ArrowLeft)_w.sub(_r);
  const wishing = _w.lengthSq()>1e-4; if(wishing)_w.normalize();
  const running = wishing && (keys.ShiftLeft||keys.ShiftRight);
  const target = wishing ? (running?RUN:WALK) : 0;
  move.speed += (move.speed<target?1:-1)*ACCEL*dt;
  move.speed = Math.max(0, Math.min(RUN, move.speed));
  if (Math.abs(move.speed-target)<ACCEL*dt) move.speed = target;
  if (!tune.on && move.speed>0.02 && wishing) {
    rig.position.addScaledVector(_w, move.speed*dt);
    const yaw = Math.atan2(_w.x,_w.z);
    let d = yaw-move.facing; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
    move.facing += d*Math.min(1,TURN*dt); yawPivot.rotation.y = move.facing;
  }
  if (tune.on) move.speed = 0;
  rig.position.y = 0;
  const rr = Math.hypot(rig.position.x,rig.position.z); if(rr>27){ rig.position.x*=27/rr; rig.position.z*=27/rr; }
  if (mixer) {
    mixer.update(dt);
    const moving = !tune.on && (move.speed>0.05 || $('cbWalk').checked);
    const wantRun = moving && running;
    const k = Math.min(1,12*dt);
    actWalk.setEffectiveWeight(THREE.MathUtils.lerp(actWalk.getEffectiveWeight(), moving&&!wantRun?1:0, k));
    actRun .setEffectiveWeight(THREE.MathUtils.lerp(actRun.getEffectiveWeight(),  moving&&wantRun?1:0, k));
  }
  if (!tune.on) { updateBow(dt); updateProjectiles(dt); }
  if (tune.on) for (const mk of tune.markers) { const s = sockets[mk.socket]; if (s) s.getWorldPosition(mk.mesh.position); }

  // camera
  if (tune.on) {
    controls.target.lerp(_tg.set(rig.position.x, 1.0, rig.position.z), Math.min(1, 8*dt));
    controls.update();
  } else {
    const cf = Math.cos(camAngle), sf = Math.sin(camAngle);
    _co.set(rig.position.x - Math.sin(move.facing)*camDist*cf, CAM_HEAD_Y + camDist*sf, rig.position.z - Math.cos(move.facing)*camDist*cf);
    camera.position.lerp(_co, Math.min(1, 6*dt));
    camera.lookAt(_tg.set(rig.position.x, CAM_HEAD_Y, rig.position.z));
  }
  key.position.set(rig.position.x+4,7,rig.position.z+5); key.target.position.set(rig.position.x,0,rig.position.z);

  const moving = move.speed>0.05;
  hud.textContent = (tune.on ? 'TUNE SOCKETS — drag the gizmo' : $('cbWalk').checked?'walk (in place)':moving?(move.speed>=RUN-0.1?'run ':'walk')+'  '+move.speed.toFixed(1)+' m/s':'idle')
    + (tune.on ? '' : '   bow: ' + bow.state + (projectiles.length?' · arrows: '+projectiles.length:''))
    + '\nclips: ' + (hud.dataset.clips||'?') + '  ·  sockets: ' + (hud.dataset.sockets||'?')
    + '\nequipped: ' + Object.keys(props).filter(k=>props[k]).join(', ')
    + tuneReadout();
  renderer.render(scene, camera); requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
