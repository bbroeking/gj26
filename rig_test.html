<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rig test — walk + equip</title>
<style>
  html,body{margin:0;height:100%;background:#2b3033;overflow:hidden;font:13px/1.4 -apple-system,sans-serif;color:#ddd}
  #hud{position:fixed;left:12px;bottom:12px;font-family:monospace;font-size:12px;background:rgba(0,0,0,.45);color:#9fb;padding:6px 10px;border-radius:4px;white-space:pre}
  #help{position:fixed;left:12px;top:12px;background:rgba(0,0,0,.45);padding:8px 12px;border-radius:4px;user-select:none}
  .k{display:inline-block;padding:1px 5px;margin:0 1px;border-radius:3px;background:rgba(255,255,255,.14);color:#fff;font-family:monospace}
  label{margin-right:10px}
</style>
<script type="importmap">
{ "imports": {
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="help">
  <b>Rig test — walk + equip</b><br>
  <span class="k">W</span><span class="k">A</span><span class="k">S</span><span class="k">D</span>/<span class="k">↑</span><span class="k">←</span><span class="k">↓</span><span class="k">→</span> — walk · <span class="k">Shift</span> — run · mouse-drag — orbit · scroll — zoom<br>
  <span class="k">X</span> — draw &amp; fire the bow &nbsp;·&nbsp; <span class="k">P</span> — placement mode &nbsp;·&nbsp; in placement: <span class="k">Tab</span> next prop · <span class="k">R</span> move/rotate<br>
  <div style="margin-top:6px">
    <label><input type="checkbox" id="cbWalk"> always walk (in place)</label>
    <label><input type="checkbox" id="cbCloak" checked> cloak</label>
    <label><input type="checkbox" id="cbQuiver" checked> quiver</label>
    <label><input type="checkbox" id="cbBow" checked> bow</label>
  </div>
</div>
<div id="hud">loading…</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { sfx } from './src/core/sfx.js';
addEventListener('keydown',   () => sfx.resume(), { once:true });
addEventListener('pointerdown', () => sfx.resume(), { once:true });

const BODY_URL  = 'models/ranger_anim_v1.glb';   // Meshy export: skinned mesh + Walking/Running, cm-scale
const PROP_URLS = { cloak:'models/prop_cloak_v1.glb', quiver:'models/prop_quiver_v1.glb',
                    bow:'models/prop_bow_v1.glb', arrow:'models/prop_arrow_v1.glb' };
// longest-axis target size (m) for each prop next to a ~1.7 m body
const PROP_SIZE = { cloak:0.85, quiver:0.42, bow:0.95, arrow:0.7 };
// Which bone each prop hangs off, + the wrapper's local offset in METRES.
// Spine/Spine01 frames: local +Y = up, local +Z = behind the character,
// local +X = the character's left. So props go to +Z to sit on the back.
const ATTACH = {
  cloak:    { bone:'Spine',    pos:[0, 0.04, 0.10], rot:[0.10, 0, 0] },           // drapes down the back
  quiver:   { bone:'Spine01',  pos:[0.07, 0.06, 0.10], rot:[-0.35, 0, 0.25] },    // diagonal on the back, mouth over the L shoulder
  bowStow:  { bone:'Spine01',  pos:[0, 0.0, 0.11], rot:[0, 0, Math.PI/3] },       // slung diagonally on the back
  bowHand:  { bone:'LeftHand', pos:[0, 0, 0], rot:[0, 0, 0] },                     // gripped when drawn
  arrowHand:{ bone:'RightHand',pos:[0, 0, 0], rot:[0, 0, 0] },                     // nocked
};
window.ATTACH = ATTACH;

// ── scene ──
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b3033);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 100);
camera.position.set(0, 1.7, 4.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0, 0.85, 0);
controls.minDistance = 1; controls.maxDistance = 12; controls.maxPolarAngle = Math.PI*0.49;
scene.add(new THREE.HemisphereLight(0xbcd0e8, 0x3a3f33, 0.7));
const key = new THREE.DirectionalLight(0xfff2e0, 1.0);
key.position.set(4,7,5); key.castShadow = true; key.shadow.mapSize.set(2048,2048);
const sc = key.shadow.camera; sc.left=-6;sc.right=6;sc.top=6;sc.bottom=-6;sc.near=.5;sc.far=30;
scene.add(key, key.target);
const ground = new THREE.Mesh(new THREE.CircleGeometry(30,64), new THREE.MeshStandardMaterial({color:0x55663f, roughness:1}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(30,30,0x6b7d52,0x47512f); grid.position.y = 0.01; scene.add(grid);

// ── prop factory ──
const PROP_GLB = {};
const _box = new THREE.Box3(), _ctr = new THREE.Vector3();
function makeProp(kind) {
  const src = PROP_GLB[kind];
  if (!src) return null;
  const g = new THREE.Group();
  const inst = src.clone(true);
  inst.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = false; } });
  inst.updateMatrixWorld(true);
  _box.setFromObject(inst);
  const span = Math.max(_box.max.x-_box.min.x, _box.max.y-_box.min.y, _box.max.z-_box.min.z) || 1;
  inst.scale.setScalar(span > 0.001 ? (PROP_SIZE[kind] || 0.5) / span : 1);
  inst.updateMatrixWorld(true);
  _box.setFromObject(inst); _box.getCenter(_ctr); inst.position.sub(_ctr);
  g.add(inst);
  return g;
}
// ── character ──
const hud = document.getElementById('hud');
const rig = new THREE.Group(); scene.add(rig);          // translate
const yawPivot = new THREE.Group(); rig.add(yawPivot);  // facing-yaw only
let model = null, mixer = null, actWalk = null, actRun = null;
let BODY_SCALE = 1;          // the 1.7/height normalization factor (≈0.01 for the cm-scale GLB)
const bones = {}, props = {};
const move = { speed:0, facing:0 };
const $ = id => document.getElementById(id);

// equip a prop wrapper onto a bone. The bone may live in a tiny local frame
// (Meshy rigs often have an intermediate cm→m node scale), so we read the
// bone's actual world scale and compensate: the prop renders at its intended
// physical size, and `pos` (in METRES) is the world-space offset from the bone.
const _bs = new THREE.Vector3();
function equip(propWrap, attachKey) {
  const a = ATTACH[attachKey]; if (!a) return;
  const bone = bones[a.bone]; if (!bone) return;
  bone.add(propWrap);
  model.updateWorldMatrix(true, true);
  bone.getWorldScale(_bs);
  const inv = 1 / (_bs.x || 1);                        // bone's world scale → bone-local-units per metre
  propWrap.userData.invScale = inv;                    // remembered so the readout can convert position back to metres
  propWrap.userData.attachKey = attachKey;
  propWrap.scale.setScalar(inv);                       // so the prop renders at world-1×
  propWrap.position.set(a.pos[0]*inv, a.pos[1]*inv, a.pos[2]*inv);   // metres → bone-local
  propWrap.rotation.set(...a.rot);
}
function attachOrDetach() {
  const want = { cloak: $('cbCloak').checked, quiver: $('cbQuiver').checked, bow: $('cbBow').checked };
  if (want.cloak && !props.cloak)  { props.cloak  = makeProp('cloak');  if(props.cloak)  equip(props.cloak,'cloak'); }
  if (!want.cloak && props.cloak)  { props.cloak.parent?.remove(props.cloak); props.cloak = null; }
  if (want.quiver && !props.quiver){ props.quiver = makeProp('quiver'); if(props.quiver) equip(props.quiver,'quiver'); }
  if (!want.quiver && props.quiver){ props.quiver.parent?.remove(props.quiver); props.quiver = null; }
  if (want.bow && !props.bow)      { props.bow    = makeProp('bow');    if(props.bow)    equip(props.bow,'bowStow'); }
  if (!want.bow && props.bow)      { props.bow.parent?.remove(props.bow); props.bow = null; }
}
window.retune = () => {
  if (props.cloak)  equip(props.cloak,'cloak');
  if (props.quiver) equip(props.quiver,'quiver');
  if (props.bow)    equip(props.bow,'bowStow');   // (assumes stowed; the X flow re-equips to bowHand)
  console.log('retuned — ATTACH:', JSON.stringify(ATTACH));
};
['cbCloak','cbQuiver','cbBow'].forEach(id => $(id).addEventListener('change', attachOrDetach));

// ── placement mode: drag a prop with a 3D gizmo, read back the ATTACH numbers ──
// P toggles it. Tab cycles which prop is selected. R toggles the gizmo between
// move and rotate. Drag the handles → the HUD prints the ATTACH entry to copy.
const PLACE_KEYS = ['cloak','quiver','bowStow','bowHand'];   // bowStow/bowHand both edit props.bow (re-parented)
const placement = { on:false, selIdx:0, tc:null, markers:[] };
function ensureGizmo() {
  if (placement.tc) return placement.tc;
  const tc = new TransformControls(camera, renderer.domElement);
  tc.setSize(0.85);
  tc.addEventListener('dragging-changed', e => { controls.enabled = !e.value; });
  scene.add(tc);
  placement.tc = tc;
  // bright bone markers (drawn on top) so you can see where the attach bones are
  const geo = new THREE.SphereGeometry(0.035, 10, 8);
  const cols = { Spine:0xff5577, Spine01:0x55bbff, Spine02:0xffbb33, LeftHand:0x55ff88, RightHand:0xff7733, Head:0xbb88ff };
  for (const [bn, col] of Object.entries(cols)) {
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: col, depthTest: false }));
    m.renderOrder = 999; m.visible = false; scene.add(m);
    placement.markers.push({ mesh: m, bone: bn });
  }
  return tc;
}
function placeSelect(idx) {
  placement.selIdx = ((idx % PLACE_KEYS.length) + PLACE_KEYS.length) % PLACE_KEYS.length;
  const key = PLACE_KEYS[placement.selIdx];
  let p = null;
  if (key === 'cloak')        p = props.cloak;
  else if (key === 'quiver')  p = props.quiver;
  else if (key === 'bowStow') { p = props.bow; if (p) equip(p, 'bowStow'); }
  else if (key === 'bowHand') { p = props.bow; if (p) equip(p, 'bowHand'); }
  if (p && placement.tc) placement.tc.attach(p); else placement.tc?.detach();
}
function togglePlacement() {
  ensureGizmo();
  placement.on = !placement.on;
  for (const mk of placement.markers) mk.mesh.visible = placement.on;
  if (placement.on) { controls.enabled = true; placeSelect(placement.selIdx); }
  else { placement.tc.detach(); }
}
function placementReadout() {
  if (!placement.on) return '';
  const key = PLACE_KEYS[placement.selIdx];
  const p = (key === 'cloak') ? props.cloak : (key === 'quiver') ? props.quiver : props.bow;
  if (!p) return `\n[placement] ${key}: prop not equipped`;
  const inv = p.userData.invScale || 1;
  const pos = [p.position.x/inv, p.position.y/inv, p.position.z/inv].map(v => +v.toFixed(3));
  const rot = [p.rotation.x, p.rotation.y, p.rotation.z].map(v => +v.toFixed(3));
  const boneName = (ATTACH[key] && ATTACH[key].bone) || p.parent?.name || '?';
  return `\n[placement: ${key}]  Tab=next · R=${placement.tc.mode}\n  ${key}: { bone:'${boneName}', pos:[${pos.join(', ')}], rot:[${rot.join(', ')}] }`;
}

// load props first (so attach sees them), then the body
Promise.all([
  ...Object.entries(PROP_URLS).map(([k,u]) => new Promise(res => new GLTFLoader().load(u,
    g => { PROP_GLB[k] = g.scene; res(); }, undefined, () => { PROP_GLB[k] = null; res(); }))),
  new Promise(res => new GLTFLoader().load(BODY_URL, g => res(g), undefined, e => { hud.textContent = 'BODY FAILED: ' + e.message; res(null); })),
]).then(results => {
  const gltf = results[results.length - 1];
  if (!gltf) return;
  model = gltf.scene;
  model.traverse(o => { if (o.isMesh||o.isSkinnedMesh){ o.castShadow=true; o.receiveShadow=false; o.frustumCulled=false; } });
  model.updateMatrixWorld(true);
  let bb = new THREE.Box3().setFromObject(model);
  const h = (bb.max.y-bb.min.y) || 1;
  BODY_SCALE = h>0.01 ? 1.7/h : 1;
  model.scale.setScalar(BODY_SCALE);
  model.updateMatrixWorld(true);
  bb = new THREE.Box3().setFromObject(model);
  model.position.y -= bb.min.y;
  yawPivot.add(model);

  // bones we attach things to
  for (const bn of ['Spine','Spine01','Spine02','LeftHand','RightHand','Head','Hips']) {
    const o = model.getObjectByName(bn); if (o) bones[bn] = o;
  }
  // animation
  mixer = new THREE.AnimationMixer(model);
  const byName = {}; for (const c of gltf.animations) byName[c.name.toLowerCase()] = c;
  const pick = (...ks) => { for (const k of ks) for (const n in byName) if (n.includes(k)) return byName[n]; return gltf.animations[0]; };
  actWalk = mixer.clipAction(pick('walk')); actRun = mixer.clipAction(pick('run'));
  actWalk.play(); actWalk.setEffectiveWeight(0); actRun.play(); actRun.setEffectiveWeight(0);

  attachOrDetach();
  hud.dataset.clips = gltf.animations.map(c=>c.name).join(', ');
  hud.dataset.bones = Object.keys(bones).join(', ');
  window.__rig = { scene, rig, yawPivot, model, mixer, bones, props, BODY_SCALE };
});

// ── input ──
const keys = {};
const TRACK = new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight','KeyX','KeyP','Tab','KeyR']);
addEventListener('keydown', e=>{
  if(!TRACK.has(e.code)) return;
  if (e.code==='KeyX' && !keys.KeyX) bow.fireQueued = true;            // edge-triggered
  if (e.code==='KeyP' && !keys.KeyP) togglePlacement();
  if (placement.on && e.code==='Tab' && !keys.Tab) placeSelect(placement.selIdx + 1);
  if (placement.on && e.code==='KeyR' && !keys.KeyR && placement.tc) placement.tc.setMode(placement.tc.mode === 'translate' ? 'rotate' : 'translate');
  keys[e.code]=true; e.preventDefault();
});
addEventListener('keyup',   e=>{ if(TRACK.has(e.code)){ keys[e.code]=false; e.preventDefault(); } });
addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

// ── bow draw→fire state machine (placeholder draw: no body clip yet) ──
// STOW → X tap → DRAW (bow Spine01→LeftHand, spawn arrow on RightHand) → AIM
//      → RELEASE (arrow detaches → projectile) → STOW.
const DRAW_T = 0.45, NOCK_AT = 0.15, AIM_T = 0.18, RELEASE_T = 0.18;
const bow = { state:'STOW', t:0, fireQueued:false, arrow:null };
const projectiles = [];
const _arrowOrigin = new THREE.Vector3(), _arrowDir = new THREE.Vector3();
function updateBow(dt) {
  if (!props.bow) { bow.state = 'STOW'; bow.fireQueued = false; return; }
  if (bow.fireQueued) { bow.fireQueued = false; if (bow.state === 'STOW') { bow.state = 'DRAW'; bow.t = 0; equip(props.bow, 'bowHand'); sfx.bowDraw(); } }
  switch (bow.state) {
    case 'DRAW':
      bow.t += dt;
      if (!bow.arrow && bow.t >= NOCK_AT) { bow.arrow = makeProp('arrow'); if (bow.arrow) equip(bow.arrow, 'arrowHand'); }
      if (bow.t >= DRAW_T) { bow.state = 'AIM'; bow.t = 0; }
      break;
    case 'AIM':
      bow.t += dt;
      if (bow.t >= AIM_T) {
        // fire: detach arrow → world projectile along the character's facing
        _arrowDir.set(Math.sin(move.facing), 0.06, Math.cos(move.facing)).normalize();
        if (bow.arrow) { bow.arrow.getWorldPosition(_arrowOrigin); bow.arrow.parent?.remove(bow.arrow); }
        else { _arrowOrigin.set(rig.position.x, 1.0, rig.position.z); }
        const proj = makeProp('arrow') || new THREE.Group();
        proj.position.copy(_arrowOrigin);
        proj.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0), _arrowDir.clone());  // arrow GLB lies along +X
        scene.add(proj);
        projectiles.push({ mesh: proj, vel: _arrowDir.clone().multiplyScalar(18), life: 2.5, landed:false });
        bow.arrow = null;
        bow.state = 'RELEASE'; bow.t = 0;
        sfx.bowRelease(); sfx.arrowWhoosh();
      }
      break;
    case 'RELEASE':
      bow.t += dt;
      if (bow.t >= RELEASE_T) { equip(props.bow, 'bowStow'); bow.state = 'STOW'; }
      break;
  }
}
function updateProjectiles(dt) {
  for (const p of projectiles) {
    p.life -= dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    p.vel.y -= 9.8 * dt * 0.5;          // mild arc
    if (p.vel.lengthSq() > 1e-4) p.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0), p.vel.clone().normalize());
    if (!p.landed && p.mesh.position.y < 0.02) { p.landed = true; p.life = Math.min(p.life, 0.4); sfx.arrowHit(); }
  }
  for (let i = projectiles.length-1; i >= 0; i--) if (projectiles[i].life <= 0) { scene.remove(projectiles[i].mesh); projectiles.splice(i,1); }
}

// ── loop ──
const WALK = 1.8, RUN = 4.0, ACCEL = 14, TURN = 10;
const _f=new THREE.Vector3(), _r=new THREE.Vector3(), _w=new THREE.Vector3(), _co=new THREE.Vector3(), _tg=new THREE.Vector3();
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(0.05, clock.getDelta());
  camera.getWorldDirection(_f); _f.y=0; _f.normalize();
  _r.set(-_f.z, 0, _f.x);          // camera-right = forward × up (D = the viewer's right)
  _w.set(0,0,0);
  if (keys.KeyW||keys.ArrowUp)_w.add(_f); if(keys.KeyS||keys.ArrowDown)_w.sub(_f);
  if (keys.KeyD||keys.ArrowRight)_w.add(_r); if(keys.KeyA||keys.ArrowLeft)_w.sub(_r);
  const wishing = _w.lengthSq()>1e-4; if(wishing)_w.normalize();
  const running = wishing && (keys.ShiftLeft||keys.ShiftRight);
  const target = wishing ? (running?RUN:WALK) : 0;
  move.speed += (move.speed<target?1:-1)*ACCEL*dt;
  move.speed = Math.max(0, Math.min(RUN, move.speed));
  if (Math.abs(move.speed-target)<ACCEL*dt) move.speed = target;
  if (!placement.on && move.speed>0.02 && wishing) {     // freeze movement while placing
    rig.position.addScaledVector(_w, move.speed*dt);
    const yaw = Math.atan2(_w.x,_w.z);
    let d = yaw-move.facing; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
    move.facing += d*Math.min(1,TURN*dt); yawPivot.rotation.y = move.facing;
  }
  if (placement.on) move.speed = 0;
  rig.position.y = 0;
  const rr = Math.hypot(rig.position.x,rig.position.z); if(rr>27){ rig.position.x*=27/rr; rig.position.z*=27/rr; }
  if (mixer) {
    mixer.update(dt);
    const moving = !placement.on && (move.speed>0.05 || $('cbWalk').checked);
    const wantRun = moving && running;
    const k = Math.min(1,12*dt);
    actWalk.setEffectiveWeight(THREE.MathUtils.lerp(actWalk.getEffectiveWeight(), moving&&!wantRun?1:0, k));
    actRun .setEffectiveWeight(THREE.MathUtils.lerp(actRun.getEffectiveWeight(),  moving&&wantRun?1:0, k));
  }
  if (!placement.on) { updateBow(dt); updateProjectiles(dt); }
  // bone markers follow their bones each frame (bones move with the walk)
  if (placement.on) for (const mk of placement.markers) { const b = bones[mk.bone]; if (b) b.getWorldPosition(mk.mesh.position); }
  _co.copy(camera.position).sub(controls.target);
  _tg.set(rig.position.x,0.85,rig.position.z);
  controls.target.lerp(_tg, Math.min(1,8*dt));
  camera.position.copy(controls.target).add(_co);
  key.position.set(rig.position.x+4,7,rig.position.z+5); key.target.position.set(rig.position.x,0,rig.position.z);
  const moving = move.speed>0.05;
  hud.textContent = (placement.on ? 'PLACEMENT MODE — drag the gizmo' : $('cbWalk').checked?'walk (in place)':moving?(move.speed>=RUN-0.1?'run ':'walk')+'  '+move.speed.toFixed(1)+' m/s':'idle')
    + (placement.on ? '' : '   bow: ' + bow.state + (projectiles.length?' · arrows in flight: '+projectiles.length:''))
    + '\nclips: ' + (hud.dataset.clips||'?') + '  ·  bones: ' + (hud.dataset.bones||'?')
    + '\nequipped: ' + Object.keys(props).filter(k=>props[k]).join(', ')
    + placementReadout();
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
