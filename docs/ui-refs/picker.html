<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>Wayfinder UI — Pick to Implement</title>
<style>
  :root{ --teal:#14342f; --teal2:#0d241f; --gold:#e3b85c; --cream:#efe7ce; --sage:#a6c264; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#0b1b18; color:var(--cream);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding:0 0 120px; }
  header{ position:sticky; top:0; z-index:5; background:linear-gradient(#0b1b18,#0b1b18ee);
    padding:18px 28px; border-bottom:1px solid #24463f; }
  h1{ margin:0; font-size:22px; color:var(--gold); letter-spacing:.5px; }
  header p{ margin:4px 0 0; color:#9fb3a6; font-size:13px; }
  section{ padding:22px 28px 4px; }
  h2{ font-size:16px; color:var(--gold); border-bottom:1px solid #24463f; padding-bottom:8px; margin:0 0 16px; }
  .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .card{ position:relative; border-radius:12px; overflow:hidden; cursor:pointer;
    border:3px solid transparent; background:#12241f; aspect-ratio:16/9; transition:.12s; }
  .card img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card:hover{ transform:translateY(-2px); }
  .card .tag{ position:absolute; left:8px; top:8px; background:#000a; color:var(--cream);
    font-size:11px; padding:2px 7px; border-radius:6px; }
  .card.sel{ border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset; }
  .card .check{ position:absolute; right:8px; top:8px; width:26px; height:26px; border-radius:50%;
    background:var(--gold); color:#12241f; font-weight:700; display:none; align-items:center;
    justify-content:center; font-size:16px; }
  .card.sel .check{ display:flex; }
  footer{ position:fixed; left:0; right:0; bottom:0; background:#0d241fe8; backdrop-filter:blur(6px);
    border-top:1px solid var(--gold); padding:14px 28px; display:flex; gap:16px; align-items:center; }
  footer .picks{ flex:1; font-family:ui-monospace,monospace; font-size:13px; color:var(--sage); min-height:20px; }
  button{ background:var(--gold); color:#12241f; border:0; border-radius:8px; padding:10px 18px;
    font-weight:700; cursor:pointer; font-size:14px; }
  button.ghost{ background:transparent; color:var(--cream); border:1px solid #3a5a52; }
  .count{ color:var(--gold); font-weight:700; }
</style>
</head>
<body>
<header>
  <h1>Wayfinder — pick the UI mockups to implement</h1>
  <p>Click any variation to select it. Pick your favourite(s) per screen — I'll match them closely in the game.
     When done, hit <b>Copy picks</b> and paste them back to me.</p>
</header>
<div id="app"></div>
<footer>
  <div class="picks" id="picks">No picks yet.</div>
  <span class="count" id="count">0 selected</span>
  <button class="ghost" onclick="clearAll()">Clear</button>
  <button onclick="copyPicks()">Copy picks</button>
</footer>
<script>
const BASE = "https://cdn.midjourney.com/";
const SUF  = "_1024_N.webp?method=shortest";
const HEROES = [
  {key:"hud",       label:"Gameplay HUD",     uuid:"c60b5c86-d24f-4c9f-9da3-b27ee32c42e8"},
  {key:"inventory", label:"Inventory / Pack", uuid:"b3949d51-37e2-4918-9ab2-0cb66e5cdbaf"},
  {key:"dialogue",  label:"NPC Dialogue",     uuid:"1fb45887-88d8-4a04-906a-7417e1c3713c"},
  {key:"title",     label:"Title / Menu",     uuid:"5d307a3c-6de4-41f3-96f4-e38782f1a53c"},
];
const sel = new Set(JSON.parse(localStorage.getItem("wf_picks")||"[]"));
const app = document.getElementById("app");
for (const h of HEROES){
  const s = document.createElement("section");
  s.innerHTML = `<h2>${h.label}</h2>`;
  const g = document.createElement("div"); g.className="grid";
  for (let n=0;n<4;n++){
    const id = `${h.key}_${n+1}`;
    const c = document.createElement("div"); c.className="card"; c.dataset.id=id;
    if (sel.has(id)) c.classList.add("sel");
    c.innerHTML = `<img loading="lazy" src="hero_${h.key}_${n+1}.webp">
      <span class="tag">${id}</span><span class="check">✓</span>`;
    c.onclick = ()=>{ c.classList.toggle("sel"); c.classList.contains("sel")?sel.add(id):sel.delete(id); save(); };
    g.appendChild(c);
  }
  s.appendChild(g); app.appendChild(s);
}
function save(){ localStorage.setItem("wf_picks", JSON.stringify([...sel])); render(); }
function render(){
  const arr=[...sel];
  document.getElementById("picks").textContent = arr.length? arr.join(", ") : "No picks yet.";
  document.getElementById("count").textContent = arr.length+" selected";
}
function clearAll(){ sel.clear(); document.querySelectorAll(".card.sel").forEach(c=>c.classList.remove("sel")); save(); }
function copyPicks(){ navigator.clipboard.writeText([...sel].join(", ")); }
render();
</script>
</body>
</html>
